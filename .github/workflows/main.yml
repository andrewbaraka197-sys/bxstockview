
name: Auto Update DSE Data

on:
  schedule:
    - cron: '0 15 * * 1-5' # Inajirun saa 6 usiku EAT, Jumatatu-Ijumaa
  workflow_dispatch: # Inakuruhusu ku-run manually ukibonyeza kitufe

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Pipeline
        run: python pipeline.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data.json
          # Tunajaribu ku-commit, kama hakuna mabadiliko inaruka bila kosa
          git commit -m "Auto-Update: Data mpya kutoka Pipeline" || echo "Hakuna mabadiliko mapya"
          git push

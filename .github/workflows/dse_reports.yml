name: DSE reports to dse_daily

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pdfplumber pandas beautifulsoup4

      - name: Run script
        run: python dse_reports.py
        env:
          LISTING_URL: "https://dse.co.tz/en/resources/research/investment-insights"

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dse_daily.csv
          git diff --cached --quiet || (git commit -m "Add DSE daily reports" && git pull --rebase && git push)
